{% extends 'base.html' %}
{% block title %}Reset Password — Greenfield Local Hub{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Reset Password</h2>
    <form method="POST" action="{{ url_for('reset_password', email=user.email) }}">
        <label>New Password</label>
        <input type="password" name="password" placeholder="Choose a new password" required>
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" placeholder="Repeat your new password" required>
        <button type="submit" class="btn-primary">Reset Password</button>
    </form>
</div>
{% endblock %}
