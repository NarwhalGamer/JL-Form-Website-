{% extends 'base.html' %}
{% block title %}Forgot Password — Greenfield Local Hub{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Forgot Password</h2>
    <p style="color:#bdbdbd; margin-bottom:16px;">Enter your email and we'll ask you a security question to reset your password.</p>
    <form method="POST" action="{{ url_for('forgot_password') }}">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="e.g. jane@email.com" required>
        <button type="submit" class="btn-primary">Continue</button>
        <p class="form-link"><a href="{{ url_for('login') }}">Back to login</a></p>
    </form>
</div>
{% endblock %}
